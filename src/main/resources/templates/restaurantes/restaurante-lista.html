<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Restaurantes Java</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<header class="bg-dark mb-5">
	<div class="container">
		<nav class="navbar border-bottom border-body" data-bs-theme="dark">
			<h1 class="text-white">Restaurantes en Java</h1>
			<a target="_blank" href="https://www.youtube.com/watch?v=qbWqXKN3m3c" class="align-right fw-bolder btn btn-secondary">
				Pulsa este botón si quieres ser un chico superguay
			</a>
		</nav>
	</div>
</header>
<div class="container">
	<h1 th:text="${title}">Restaurantes listado</h1>
	<p th:text="|${#lists.size(restaurantes)} resultados|"></p>
	<p th:text="|${restaurantes.size()} resultados|"></p>
	<p th:text="|${numeroRestaurantes} resultados|"></p>
	<ul class="list-group">
		<li class="list-group-item" th:each="restaurante : ${restaurantes}">
			<span th:text="${restaurante.nombre}"></span>
			<span th:text="${restaurante.precioMedio}"></span>
			<a th:href="@{/restaurantes/{id}(id=${restaurante.id})}">Ver restaurante</a>
		</li>
	</ul>
</div>
</body>
</html>
