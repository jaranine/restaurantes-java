<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Listado reseñas')}"></head>
<body class="d-flex flex-column min-vh-100">

<header th:replace="~{layout/navbar :: navbar}"></header>

<main class="container flex-grow-1">

	<h1 class="mb-4">
		<i class="fa-regular fa-comments text-primary me-2"></i> Opiniones de clientes
	</h1>

	<div th:if="${resenas.isEmpty()}" class="alert alert-light border">
		Aún no hay reseñas.
	</div>
	<!--/*@thymesVar id="mensaje" type="java.lang.String"*/-->
	<div th:if="${mensaje != null}" class="alert alert-success fade show alert-dismissible" role="alert">
		<i class="fa-solid fa-check-circle"></i>
		<span th:text="${mensaje}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
	</div>

	<div class="row row-cols-1 row-cols-md-2 g-3">
		<div class="col" th:each="resena : ${resenas}">
			<div class="card h-100 shadow-sm">
				<div class="card-body">
					<div class="d-flex justify-content-between align-items-start mb-2">
						<h5 class="card-title mb-0" th:text="${resena.titulo}">Título</h5>
						<span class="badge bg-warning text-dark">
                            <i class="fa-solid fa-star me-1"></i>
                            <span th:text="${resena.clasificacion + ' / 5'}"></span>
                        </span>
					</div>
					<p class="card-text" th:text="${resena.descripcion}">Descripción</p>
					<p class="text-muted small mb-0">
						<i class="fa-regular fa-calendar me-1"></i>
						<span th:text="${resena.fechaCreacion}"></span>
					</p>
				</div>
				<div class="card-footer bg-transparent small">
					<div th:if="${resena.restaurante != null}">
						<i class="fa-solid fa-store text-primary me-1"></i>
						<a th:href="@{/restaurantes/{id}(id=${resena.restaurante.id})}"
						   th:text="${resena.restaurante.nombre}">Restaurante</a>
					</div>
					<div th:if="${resena.plato != null}">
						<i class="fa-solid fa-utensils text-primary me-1"></i>
						<a th:href="@{/platos/{id}(id=${resena.plato.id})}"
						   th:text="${resena.plato.nombre}">Plato</a>
						<span th:if="${resena.plato.restaurante != null}"
						      class="text-muted">
                            — en
                            <a th:href="@{/restaurantes/{id}(id=${resena.plato.restaurante.id})}"
                               th:text="${resena.plato.restaurante.nombre}">Restaurante</a>
                        </span>
					</div>
					<div class="my-3">
						<!-- Botón de borrar -->
						<a class="btn btn-secondary" th:href="@{/resenas/{id}(id=${resena.id})}">
							<i class="fa-solid fa-eye mr-2"></i> Ver
						</a>

						<a class="btn btn-success" th:href="@{/resenas/editar/{id}(id=${resena.id})}">
							<i class="fa-solid fa-pencil mr-2"></i> Editar
						</a>

						<a class="btn btn-danger" th:href="@{/resenas/delete/{id}(id=${resena.id})}"
						   onclick="return confirm('Esta acción borra, ¿quiere borrar esta reseña?')">
							<i class="fa-solid fa-trash mr-2"></i> Borrar
						</a>

					</div>
				</div>
			</div>
		</div>
	</div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
